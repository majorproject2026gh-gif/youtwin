version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: youtwin-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: youtwin-postgres
    environment:
      POSTGRES_USER: youtwin
      POSTGRES_PASSWORD: youtwin
      POSTGRES_DB: youtwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: youtwin-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # after first start: docker exec -it youtwin-ollama ollama pull llama3

volumes:
  qdrant_data:
  postgres_data:
  ollama_data:
