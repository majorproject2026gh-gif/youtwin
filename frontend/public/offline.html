<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#08080A" />
<title>YouTwin · Offline</title>
<link rel="icon" href="/icons/favicon-32.png" />
<style>
  :root { color-scheme: dark light; --bg:#08080A; --fg:#F4EFE6; --muted:rgba(244,239,230,.6); --line:rgba(255,255,255,.1); }
  @media (prefers-color-scheme: light) { :root { --bg:#F8F5EF; --fg:#1A1714; --muted:rgba(26,23,20,.6); --line:rgba(0,0,0,.1); } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; }
  main { max-width: 340px; }
  img { width:72px; height:72px; }
  h1 { font-size: 24px; margin: 20px 0 8px; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color:#fff; border:0; border-radius:14px; padding:14px 28px; min-height:48px; background:linear-gradient(180deg,#FF8266,#E0483F); cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>YouTwin needs a connection to reach the creator's twin. Check your signal and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
